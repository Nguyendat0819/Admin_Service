# ============================================================
#  application-test.yaml — dùng cho mvn test
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/test
          jwk-set-uri: http://localhost:9999/realms/test/protocol/openid-connect/certs

logging:
  level:
    root: WARN
    com.example.java_template: INFO
    org.hibernate.SQL: OFF
